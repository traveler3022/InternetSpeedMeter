name: Startup check

on:
  push:
    branches: [ "startup-check" ]
  workflow_dispatch:

jobs:
  emulator:
    name: Android 13 (${{ matrix.tag }}, ${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: crash-fix, tag: fix, locale: en }
          - { ref: crash-fix, tag: fix, locale: fa-IR }
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          path: scripts

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: app-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        working-directory: app-src
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_LOCALE: ${{ matrix.locale }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: app-src
          script: bash ../scripts/.github/startup-check.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-${{ matrix.tag }}-${{ matrix.locale }}
          path: app-src/out/
