name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Debug APK to GitHub Release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deep-debug') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            TAG="v1.1-debug"
            TITLE="Internet Meter (Debug APK)"
          else
            TAG="v1.1-deep-debug"
            TITLE="Internet Meter 1.1 Deep Debug"
          fi
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          NOTES="### Internet Meter Debug Build
          - **Branch:** ${GITHUB_REF_NAME}
          - **Built on:** $(date -u '+%Y-%m-%d %H:%M UTC')
          - **Commit:** ${GITHUB_SHA:0:7}
          - **Features:** High-tech icons, Persian UI, TrafficMath overflow protection, Mutex DB concurrency, stateLock thread-safety
          - **Signature:** Standard v2/v3 signing (Installs on Android 11+)"

          # Delete existing release and tag so the tag points to the current commit
          gh release delete "$TAG" --yes --cleanup-tag || true

          # Create a fresh release pointing directly to this commit
          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --prerelease
